name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Swift tests
        run: swift test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and test with the in-box C# compiler
        shell: pwsh
        run: ./script/build_windows.ps1 -Test
      - name: Build with the .NET SDK
        run: dotnet build windows/MutsumiPet.Windows/MutsumiPet.Windows.csproj -c Release
      - name: Run tests with the .NET SDK
        run: dotnet run --project windows/MutsumiPet.Windows.Tests/MutsumiPet.Windows.Tests.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: MutsumiPet-Windows
          path: build/windows/MutsumiPet.exe
